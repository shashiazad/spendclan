<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Solid background for PWA maskable compliance -->
  <rect width="512" height="512" fill="#0b1120" />
  
  <defs>
    <linearGradient id="pwa-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Centered SpendClan Logo (scaled and padded for the safe zone) -->
  <g transform="translate(96, 96) scale(10)">
    {/* Wallet base */}
    <rect x="2" y="9" width="12" height="14" rx="2.5" stroke="url(#pwa-logo-grad)" stroke-width="2" />
    
    {/* Wallet clasp */}
    <path d="M14 17h-2.5a1.5 1.5 0 0 1-1.5-1.5v-1a1.5 1.5 0 0 1 1.5-1.5h2.5" stroke="url(#pwa-logo-grad)" stroke-width="2" stroke-linecap="round" />
    
    {/* Trendline inside wallet (Expense Tracking & Savings) */}
    <path d="M5 17l2.5-2.5 2 2 3-3" stroke="url(#pwa-logo-grad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    
    {/* Splitting Paths (Bill Splits & shared expenses) */}
    <path d="M14 16h6" stroke="url(#pwa-logo-grad)" stroke-width="2" stroke-linecap="round" />
    <path d="M20 16l5-6" stroke="url(#pwa-logo-grad)" stroke-width="2" stroke-linecap="round" />
    <path d="M20 16l5 6" stroke="url(#pwa-logo-grad)" stroke-width="2" stroke-linecap="round" />
    
    {/* Clan Nodes */}
    <circle cx="25" cy="10" r="2.5" fill="url(#pwa-logo-grad)" />
    <circle cx="26" cy="16" r="2.5" fill="url(#pwa-logo-grad)" />
    <circle cx="25" cy="22" r="2.5" fill="url(#pwa-logo-grad)" />
  </g>
</svg>
